<!doctype html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>Keynote</title><meta name="viewport" content="initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,width=device-width"/><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#stageArea{transform-origin:center center}</style></head><body id="body" bgcolor="black"><div id="stageArea"><div id="stage" class="stage"></div><div id="hyperlinkPlane" class="stage"></div></div><div id="slideshowNavigator"></div><div id="slideNumberControl"></div><div id="slideNumberDisplay"></div><div id="helpPlacard"></div><div id="waitingIndicator"><div id="waitingSpinner"></div></div><script src="assets/player/main.js"></script><script>
/* Full-bleed override: scale the Keynote stage to COVER the whole browser window
   (no letterbox bars) on top of the player's own contain-fit. Uniform scale = no
   distortion; minimal symmetric crop on off-16:9 windows. Re-applies on resize. */
(function(){
  function cover(){
    var sa=document.getElementById('stageArea');
    if(!sa) return;
    var w=parseFloat(sa.style.width)||sa.offsetWidth;
    var h=parseFloat(sa.style.height)||sa.offsetHeight;
    if(!w||!h) return;
    var s=Math.max(window.innerWidth/w, window.innerHeight/h);
    sa.style.transform = s>1.0001 ? 'scale('+s+')' : '';
  }
  var n=0,iv=setInterval(function(){cover();if(++n>60)clearInterval(iv);},120);
  window.addEventListener('resize',function(){setTimeout(cover,60);});
  window.addEventListener('load',cover);
})();
</script></body></html>
